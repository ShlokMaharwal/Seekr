services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --save 60 1 --loglevel warning
    ports:
      - '127.0.0.1:6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 256m

  mongo:
    image: mongo:7
    restart: unless-stopped
    ports:
      - '127.0.0.1:27017:27017'
    volumes:
      - mongo_data:/data/db
    environment:
      MONGO_INITDB_DATABASE: seekr
    healthcheck:
      test: ['CMD-SHELL', 'mongosh --quiet --eval "db.adminCommand(''ping'')" || exit 1']
      interval: 10s
      timeout: 10s
      retries: 6
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 512m

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    ports:
      - '127.0.0.1:4001:4000'
    environment:
      REDIS_URL: redis://redis:6379
      MONGO_URL: mongodb://mongo:27017
      PORT: '4000'
      LOG_LEVEL: info
      INDEX_SNAPSHOT_PATH: /data/index.bin
      BM25_TITLE_WEIGHT: ${BM25_TITLE_WEIGHT:-0}
      SEARCH_RATE_LIMIT_MAX: ${SEARCH_RATE_LIMIT_MAX:-60}
      ADMIN_TOKEN: ${ADMIN_TOKEN:-}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173,http://localhost:3000,http://localhost:8080}
    volumes:
      - index_data:/data
    depends_on:
      redis:
        condition: service_healthy
      mongo:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://localhost:4000/health']
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 1g

  crawler:
    build:
      context: .
      dockerfile: apps/crawler/Dockerfile
    restart: unless-stopped
    environment:
      REDIS_URL: redis://redis:6379
      MONGO_URL: mongodb://mongo:27017
      LOG_LEVEL: info
      SIMHASH_MAX_DISTANCE: ${SIMHASH_MAX_DISTANCE:-3}
    depends_on:
      redis:
        condition: service_healthy
      mongo:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'node', 'apps/crawler/dist/health.js']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    # Scale with: docker compose up --scale crawler=3
    deploy:
      replicas: 1
      resources:
        limits:
          memory: 512m

volumes:
  redis_data:
  mongo_data:
  index_data:
